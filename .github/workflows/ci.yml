# Compile-check Kalam on every push / PR.
# Headless: no display needed — we only cargo fmt/clippy/build.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A newer push cancels the run it supersedes. Without this, two runs of this
# workflow on one branch race to commit ci-logs/ files back to it: both publish
# steps `git pull --rebase` and the second one rebases onto a file the first
# just rewrote, hits a conflict, and its `git push ... || true` silently drops
# the report. That is how the first reader screenshot report was lost.
# kalam-engine's own ci.yml uses the same group for the same reason.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (ubuntu)
    # 26.04, not -latest: kalam-reader asks gtk4 for the v4_16 feature, Cargo
    # unifies that with Kalam's v4_12, and the gdk4-sys build script then
    # demands system GTK >= 4.16 through pkg-config. 24.04 (still -latest)
    # ships 4.14.5 and fails with "Package 'gtk4' has version '4.14.5',
    # required version is '>= 4.16'". Same reason kalam-engine's own CI is on
    # 26.04. The owner's machine is Arch, gtk4 4.20+.
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-4-dev libadwaita-1-dev libglib2.0-dev \
            libpango1.0-dev libgdk-pixbuf-2.0-dev \
            libgraphene-1.0-dev libgtksourceview-5-dev \
            libclang-dev libfontconfig1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Cargo.lock is committed (see the ROADMAP entry for 2026-09-04). The
      # Arena sandbox has no network route to crates.io, so the agent cannot
      # generate or refresh it there; this step is how the lockfile gets
      # created and how a legitimate dependency change gets recorded.
      #
      # `cargo generate-lockfile` only writes when the manifest and the lock
      # disagree, so on a normal run this is a no-op and commits nothing.
      - name: Cargo.lock (generate and push if missing or stale)
        run: |
          cargo generate-lockfile
          if git diff --quiet -- Cargo.lock && [ -z "$(git status --porcelain Cargo.lock)" ]; then
            echo "Cargo.lock: unchanged"
          else
            echo "Cargo.lock: updating and pushing"
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add -f Cargo.lock
            git commit -m "ci: update Cargo.lock [skip ci]"
            git pull --rebase --autostash origin "$GITHUB_REF_NAME" || true
            git push origin "HEAD:$GITHUB_REF_NAME" || true
          fi

      # Ensure self-contained pure-Rust OCR models are bundled in assets/models/ocr/
      - name: Fetch OCR models
        run: |
          mkdir -p assets/models/ocr
          DET_URL="https://ocrs-models.s3-accelerate.amazonaws.com/text-detection.rten"
          REC_URL="https://ocrs-models.s3-accelerate.amazonaws.com/text-recognition.rten"
          DET_FILE="assets/models/ocr/text-detection.rten"
          REC_FILE="assets/models/ocr/text-recognition.rten"

          if [ ! -f "$DET_FILE" ] || [ $(wc -c < "$DET_FILE") -lt 1000000 ]; then
            echo "Downloading text-detection.rten..."
            curl -L -f -o "$DET_FILE" "$DET_URL"
          fi
          if [ ! -f "$REC_FILE" ] || [ $(wc -c < "$REC_FILE") -lt 1000000 ]; then
            echo "Downloading text-recognition.rten..."
            curl -L -f -o "$REC_FILE" "$REC_URL"
          fi

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -f "$DET_FILE" "$REC_FILE"
          if ! git diff --cached --quiet; then
            echo "Committing downloaded OCR models..."
            git commit -m "chore(ocr): bundle text-detection and text-recognition rten models [skip ci]"
            git pull --rebase --autostash origin "$GITHUB_REF_NAME" || true
            git push origin "HEAD:$GITHUB_REF_NAME" || true
          fi

      # Auto-fixes formatting and pushes the fix back.
      #
      # The push must rebase first. Earlier steps in *other* jobs commit
      # ci-logs/ to the same branch, so a bare `git push` here fails whenever
      # one of those landed between checkout and now — and because this step
      # has no `continue-on-error`, that failed the whole run over formatting
      # that had already been applied. It looked like a code problem and was
      # not. Also publishes the diff, since the sandbox cannot read Actions
      # logs and "rustfmt failed" with no detail is unactionable.
      # Formats, and reports what it changed. Deliberately does NOT fail the
      # run, and deliberately does not push.
      #
      # It used to auto-commit the fix. That failed three runs in a row for
      # reasons that had nothing to do with the code: the push collided with
      # the `Cargo.lock` step above (which also pushes) and with the ci-logs
      # commits from other jobs, and a rejected push exited non-zero and killed
      # the build. Formatting is not worth failing a build over, and a step
      # whose failure mode is unrelated to what it checks sends every
      # investigation to the wrong place (pitfalls §23).
      #
      # So: report, never gate. The diff is published by the step below, which
      # the agent can read — it cannot download Actions logs, so a bare
      # "rustfmt failed" was unactionable.
      - name: rustfmt (report only)
        id: fmt
        run: |
          cargo fmt --all
          mkdir -p ci-logs
          if git diff --quiet; then
            echo "rustfmt: clean"
            echo "dirty=0" >> "$GITHUB_OUTPUT"
            # Leave a note rather than deleting the file. Deleting it only
            # removed the working copy -- the stale diff stayed committed, so
            # a later clean run still showed the previous run's complaint and
            # read as an outstanding problem.
            mkdir -p ci-logs
            printf 'clean\n--- run %s ---\n' "$GITHUB_RUN_ID" \
              > ci-logs/rustfmt-latest.diff
            echo "dirty=1" >> "$GITHUB_OUTPUT"
          else
            echo "rustfmt: the tree is not formatted; diff follows"
            git diff | tee ci-logs/rustfmt-latest.diff
            echo "--- run $GITHUB_RUN_ID ---" >> ci-logs/rustfmt-latest.diff
            echo "dirty=1" >> "$GITHUB_OUTPUT"
          fi
          # Restore, so clippy and the build see the committed source rather
          # than a locally reformatted copy.
          git checkout -- .

      # Runs on clean runs too, so the published file always describes the
      # latest run rather than the last untidy one.
      - name: publish the rustfmt diff
        if: steps.fmt.outputs.dirty == '1'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -f ci-logs/rustfmt-latest.diff
          git commit -m "ci: publish rustfmt diff [skip ci]" || true
          git pull --rebase --autostash origin "$GITHUB_REF_NAME" || true
          git push origin "HEAD:$GITHUB_REF_NAME" || true
        continue-on-error: true

      # The Arena sandbox cannot download Actions logs (the log host is
      # unreachable from it), so on failure we commit the compiler output back
      # to the branch under ci-logs/ where the agent can read it.
      # `-D warnings` turns every warning into an error, including plain rustc
      # ones like dead_code. Without it a warning could never fail a run: an
      # unused `pub fn` in src/service.rs sat through several "green" runs and
      # was only caught when a human read their own build output. `--all-targets`
      # compiles the bin, so unused items in the binary crate are reported.
      #
      # Trade-off, accepted deliberately: the toolchain is `stable`, so a new
      # Rust release that adds a lint can turn this red without the code
      # changing. The failure publishes to ci-logs/clippy-latest.txt, which the
      # agent can read, so that is recoverable rather than mysterious.
      - name: clippy
        id: clippy
        run: |
          set -o pipefail
          {
            echo "--- system libraries (the agent cannot read Actions logs, and"
            echo "--- kalam-reader's gtk4 v4_16 feature needs system GTK >= 4.16) ---"
            for pc in gtk4 gdk4 libadwaita-1 glib-2.0; do
              printf '%s: %s\n' "$pc" "$(pkg-config --modversion "$pc" 2>&1 || echo 'not found')"
            done
          } | tee /tmp/clippy.txt
          # --workspace, not just --all-targets. This workspace has a root
          # package (`kalam`), so with no `default-members` key Cargo selects
          # ONLY that package by default -- --all-targets picks targets, not
          # packages. Without --workspace the eight crates under crates/ (seven
          # chapbook plus kalam-reader) and the two under tools/ were compiled
          # as dependencies but never linted, and chapbook-viewer-gtk,
          # chapbook-cli and kalam-reader-demo (not dependencies of anything)
          # were never even built. They could fail to compile and this run
          # stayed green. 10 of the 11 workspace members were being skipped.
          cargo clippy --workspace --all-targets --message-format=short -- -D warnings 2>&1 \
            | tee -a /tmp/clippy.txt
        continue-on-error: true

      # Runs on success too, for the same reason as the test log above.
      - name: publish clippy log
        if: always() && steps.clippy.outcome != 'skipped'
        run: |
          mkdir -p ci-logs
          # Prefer the diagnostic lines, but always fall back to the tail: a
          # grep that matches nothing used to publish an empty file, which is
          # worse than useless.
          grep -E "error|warning:" /tmp/clippy.txt | head -100 > ci-logs/clippy-latest.txt || true
          if [ ! -s ci-logs/clippy-latest.txt ]; then
            echo "(no lines matched; last 100 lines of output)" > ci-logs/clippy-latest.txt
          fi
          # The grep keeps the compiler's own lines; a failed build script is
          # reported by cargo as one "error:" line and the real cause is on the
          # lines after it, which match neither pattern. Append the tail always.
          echo "" >> ci-logs/clippy-latest.txt
          echo "=== last 80 lines of the raw log ===" >> ci-logs/clippy-latest.txt
          tail -80 /tmp/clippy.txt >> ci-logs/clippy-latest.txt || true
          echo "--- run $GITHUB_RUN_ID ---" >> ci-logs/clippy-latest.txt
          # Uncapped copy: the excerpt above is for humans, this is what the
          # agent reads when the first error is not in the tail.
          cp /tmp/clippy.txt ci-logs/clippy-full.txt || true
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -f ci-logs/clippy-latest.txt ci-logs/clippy-full.txt
          git commit -m "ci: publish clippy failures [skip ci]" || true
          git pull --rebase --autostash origin "$GITHUB_REF_NAME" || true
          git push origin "HEAD:$GITHUB_REF_NAME" || true

      - name: fail if clippy failed
        if: steps.clippy.outcome == 'failure'
        run: exit 1

      # cargo test: compiles and RUNS the unit tests (in-memory SQLite —
      # headless, no display needed). Failures publish the diagnostics to
      # ci-logs/test-latest.txt, same pattern as clippy above.
      - name: test
        id: test
        run: |
          set -o pipefail
          # --workspace: see the clippy step above. Before this, the run
          # executed one test binary -- `unittests src/main.rs` -- and stopped.
          # The ~420 tests under crates/*/tests and tools/*/tests (pagination,
          # reader conformance, locators, render goldens, the stability policy)
          # never ran at all.
          cargo test --workspace --all-targets --message-format=short 2>&1 \
            | tee /tmp/test.txt
        continue-on-error: true

      # Runs on success too. Publishing only on failure leaves the previous
      # failure committed, so a later green run still shows red -- it misread
      # as an outstanding problem three separate times before this was fixed.
      - name: publish test log
        if: always() && steps.test.outcome != 'skipped'
        run: |
          mkdir -p ci-logs
          grep -E "error|FAILED|panicked|test result" /tmp/test.txt \
            | head -100 > ci-logs/test-latest.txt || true
          if [ ! -s ci-logs/test-latest.txt ]; then
            echo "(no lines matched; last 100 lines of output)" > ci-logs/test-latest.txt
            tail -100 /tmp/test.txt >> ci-logs/test-latest.txt || true
          fi
          echo "--- run $GITHUB_RUN_ID ---" >> ci-logs/test-latest.txt
          cp /tmp/test.txt ci-logs/test-full.txt || true
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -f ci-logs/test-latest.txt ci-logs/test-full.txt
          git commit -m "ci: publish test failures [skip ci]" || true
          git pull --rebase --autostash origin "$GITHUB_REF_NAME" || true
          git push origin "HEAD:$GITHUB_REF_NAME" || true

      - name: fail if tests failed
        if: steps.test.outcome == 'failure'
        run: exit 1

      - name: build (release)
        run: cargo build --release

      # Diagnostic: replay the reader's OCR pipeline on the scanned-fixture
      # pages (release profile reuses the deps just built above) and publish
      # the full report - line geometry plus which lines the real selection
      # logic can and cannot reach - to ci-logs for offline analysis.
      - name: OCR scan probe (diagnostic)
        run: |
          set -o pipefail
          status=0
          cargo test --release --bin kalam ocr_scan_probe -- --ignored --nocapture 2>&1 | tee /tmp/ocr-probe.txt || status=$?
          mkdir -p ci-logs
          cp /tmp/ocr-probe.txt ci-logs/ocr-probe-latest.txt
          echo "--- run $GITHUB_RUN_ID ---" >> ci-logs/ocr-probe-latest.txt
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -f ci-logs/ocr-probe-latest.txt
          git commit -m "ci: publish OCR probe report [skip ci]" || true
          git pull --rebase --autostash origin "$GITHUB_REF_NAME" || true
          git push origin "HEAD:$GITHUB_REF_NAME" || true
          exit $status

      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: kalam-release-binary
          path: target/release/kalam
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Smoke test: does the app actually launch, and does a book open?
  #
  # Why this exists when the build job already passes: compiling proves nothing
  # about a GTK app. This job has caught two bugs the build job was green
  # through -- Home's covers never loaded, and only the first two rows of the
  # grid ever filled. Neither is detectable from a unit test.
  #
  # Slimmed on 2026-09-18. It used to take a full grid screenshot pass, upload
  # PNG artifacts, and run a second 2,000-book scale job after it. The PNGs
  # went to nobody (the agent cannot download artifacts, and the text report
  # carries the same information), and the scale job re-answered a question
  # that was settled on 2026-09-04 and is recorded in
  # ci-logs/scale-2000-comparison.txt: windowed grid 247 MB / 7.1 ms against
  # the old build-every-card grid's 352 MB / 139.7 ms. Those numbers are the
  # evidence; re-measuring them on every push was not. Bring the scale run
  # back deliberately if the grid ever changes.
  #
  # One run remains, on the `read-1` route: it opens a real book through the
  # engine widget, so a panic, a wiring mistake or a blank page is caught.
  #
  # A SEPARATE job, on purpose:
  #   * `continue-on-error` so a flaky compositor can never block a correct
  #     change. This is a diagnostic, not a gate. CI remains the gate for
  #     compile/clippy/test only.
  #   * it needs `build` to pass first, so we never smoke-test a broken tree.
  #
  # Caveats, unchanged: the software (Cairo) renderer is NOT the renderer on a
  # real desktop, and headless sway is one virtual output rather than a tiling
  # session. A pass here means "it did not crash and it drew something", not
  # "it looks right". Read docs/ci/README-screenshots.md.
  # ---------------------------------------------------------------------------
  screenshots:
    name: smoke test (headless sway) — ${{ matrix.group }}
    needs: build
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        group: [epub, comics, pdf, pages, settings-a, settings-b]
    # 26.04, not -latest: kalam-reader asks gtk4 for the v4_16 feature, Cargo
    # unifies that with Kalam's v4_12, and the gdk4-sys build script then
    # demands system GTK >= 4.16 through pkg-config. 24.04 (still -latest)
    # ships 4.14.5 and fails with "Package 'gtk4' has version '4.14.5',
    # required version is '>= 4.16'". Same reason kalam-engine's own CI is on
    # 26.04. The owner's machine is Arch, gtk4 4.20+.
    runs-on: ubuntu-26.04
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install system runtime dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev libglib2.0-dev \
            libpango1.0-dev libgdk-pixbuf-2.0-dev \
            libgraphene-1.0-dev \
            sway grim wtype \
            xwayland \
            fonts-dejavu-core \
            python3 \
            libfontconfig1-dev

      - name: Download release binary
        uses: actions/download-artifact@v4
        with:
          name: kalam-release-binary
          path: target/release

      - name: Make binary executable
        run: chmod +x target/release/kalam

      # 139 books: matches the library the user actually measured on, so the
      # seeded state is a familiar one rather than an arbitrary small number.
      #
      # The reader is the part this branch replaced, and the owner's machine
      # would otherwise be the first place the engine widget ever runs.
      # `read-<id>` opens it on a seeded book, so a panic, a wiring mistake or
      # a blank page is caught here, in a text report the agent can read. Book
      # 1 always exists -- the seeder inserts with AUTOINCREMENT from 1.
      # TAP is deliberately not set: driving a pointer tap with swaymsg
      # reported "no change" at three positions in a fullscreen window with
      # both a one-second hold and an 80 ms one, which is evidence about
      # sway's synthetic pointer under a headless compositor, not about the
      # reader. The probe is still in screenshot.sh (TAP=1) for whoever
      # revisits it; the tap behaviour itself is verified by hand on the
      # owner's machine.
      - name: open a book and report
        if: matrix.group == 'epub'
        run: |
          chmod +x docs/ci/screenshot.sh docs/ci/check-shot.py
          BOOKS=139 OUT=ci-shots-reader SETTLE=25 ROUTE=read-1 \
            docs/ci/screenshot.sh

      # EPUB T2 (decisions 14-20, 145): the pure page with its summoned
      # chrome stood up on request — Back+Bubble unit, bookmark ribbon,
      # location percentage — in both modes. The page ground is the app
      # palette's own bg now, so the two frames also prove the page
      # follows the app theme rather than a reading theme.
      - name: open a book with its chrome up (light) and report
        if: matrix.group == 'epub'
        run: |
          BOOKS=139 OUT=ci-shots-reader-chrome-light SETTLE=25 ROUTE=read-1 \
            READER_ACTION=chrome THEME=terracotta-light \
            docs/ci/screenshot.sh

      - name: open a book with its chrome up (dark) and report
        if: matrix.group == 'epub'
        run: |
          BOOKS=139 OUT=ci-shots-reader-chrome-dark SETTLE=25 ROUTE=read-1 \
            READER_ACTION=chrome THEME=terracotta-dark \
            docs/ci/screenshot.sh

      # EPUB T3 (decisions 20-24, 145, 147): the left panel as Contents
      # + Notes and the right as Settings alone. The seeded book has
      # nothing annotated, so the Notes frame proves the chips and the
      # empty state rather than items; the Settings frame proves the
      # This-book card, the preview and the inset sections.
      - name: open the contents panel (dark) and report
        if: matrix.group == 'epub'
        run: |
          BOOKS=139 OUT=ci-shots-reader-contents SETTLE=25 ROUTE=read-1 \
            READER_ACTION=contents THEME=terracotta-dark \
            docs/ci/screenshot.sh

      - name: open the notes panel (dark) and report
        if: matrix.group == 'epub'
        run: |
          BOOKS=139 OUT=ci-shots-reader-notes SETTLE=25 ROUTE=read-1 \
            READER_ACTION=notes THEME=terracotta-dark \
            docs/ci/screenshot.sh

      - name: open the reader settings panel (dark) and report
        if: matrix.group == 'epub'
        run: |
          BOOKS=139 OUT=ci-shots-reader-settings SETTLE=25 ROUTE=read-1 \
            READER_ACTION=settings THEME=terracotta-dark \
            docs/ci/screenshot.sh

      # EPUB T4 (decisions 26, 29): the selection chip and the
      # annotation popover. The chip frame raises the chip over a
      # synthetic selection report; the annotation frame makes a real
      # highlight on the opening chapter and taps it.
      - name: raise the selection chip (dark) and report
        if: matrix.group == 'epub'
        run: |
          BOOKS=139 OUT=ci-shots-reader-chip SETTLE=25 ROUTE=read-1 \
            READER_ACTION=chip THEME=terracotta-dark \
            docs/ci/screenshot.sh

      - name: open the annotation popover (dark) and report
        if: matrix.group == 'epub'
        run: |
          BOOKS=139 OUT=ci-shots-reader-annotation SETTLE=25 ROUTE=read-1 \
            READER_ACTION=annotation THEME=terracotta-dark \
            docs/ci/screenshot.sh

      # EPUB T4 (decision 31): the dictionary card. The seeder plants a
      # three-word fixture (bank/river/shore) because the bundled packs
      # install after the snapshot; the missing frame looks up "riv"
      # so the did-you-mean chips do the talking.
      - name: open the dictionary card (dark) and report
        if: matrix.group == 'epub'
        run: |
          BOOKS=139 OUT=ci-shots-reader-dict SETTLE=25 ROUTE=read-1 \
            READER_ACTION=dict READER_FIXTURE=1 THEME=terracotta-dark \
            docs/ci/screenshot.sh

      - name: open the dictionary card missing (dark) and report
        if: matrix.group == 'epub'
        run: |
          BOOKS=139 OUT=ci-shots-reader-dict-missing SETTLE=25 ROUTE=read-1 \
            READER_ACTION=dict-missing READER_FIXTURE=1 THEME=terracotta-dark \
            docs/ci/screenshot.sh

      # EPUB search (decision 34): the floating pill over a query
      # with chapter matches, and the accent no-match state.
      - name: open reader search (dark) and report
        if: matrix.group == 'epub'
        run: |
          BOOKS=139 OUT=ci-shots-reader-search SETTLE=25 ROUTE=read-1 \
            READER_ACTION=search THEME=terracotta-dark \
            docs/ci/screenshot.sh

      - name: open reader search missing (dark) and report
        if: matrix.group == 'epub'
        run: |
          BOOKS=139 OUT=ci-shots-reader-search-missing SETTLE=25 ROUTE=read-1 \
            READER_ACTION=search-missing THEME=terracotta-dark \
            docs/ci/screenshot.sh

      # Comics reader (decisions 35-43, 50): the pure page with its
      # summoned chrome in both modes, then each floating panel and
      # the page-jump field's out-of-range state. The comic fixture's
      # chapter 2 is id BOOKS+2 and stands at page 4 of 12 with a
      # bookmark, so the frames also prove the filled ribbon and the
      # series-wide location text (`16 / 24`).
      - name: open a comic with its chrome up (light) and report
        if: matrix.group == 'comics'
        run: |
          BOOKS=20 OUT=ci-shots-comics-chrome-light SETTLE=20 \
            ROUTE=comic-read-22 COMIC_FIXTURE=1 COMIC_ACTION=chrome \
            THEME=terracotta-light \
            docs/ci/screenshot.sh

      - name: open a comic with its chrome up (dark) and report
        if: matrix.group == 'comics'
        run: |
          BOOKS=20 OUT=ci-shots-comics-chrome-dark SETTLE=20 \
            ROUTE=comic-read-22 COMIC_FIXTURE=1 COMIC_ACTION=chrome \
            THEME=terracotta-dark \
            docs/ci/screenshot.sh

      - name: open the comic chapters panel (dark) and report
        if: matrix.group == 'comics'
        run: |
          BOOKS=20 OUT=ci-shots-comics-chapters-dark SETTLE=20 \
            ROUTE=comic-read-22 COMIC_FIXTURE=1 COMIC_ACTION=chapters \
            THEME=terracotta-dark \
            docs/ci/screenshot.sh

      - name: open the comic pages panel (dark) and report
        if: matrix.group == 'comics'
        run: |
          BOOKS=20 OUT=ci-shots-comics-pages-dark SETTLE=25 \
            ROUTE=comic-read-22 COMIC_FIXTURE=1 COMIC_ACTION=pages \
            THEME=terracotta-dark \
            docs/ci/screenshot.sh

      - name: open the comic reading panel (dark) and report
        if: matrix.group == 'comics'
        run: |
          BOOKS=20 OUT=ci-shots-comics-reading-dark SETTLE=20 \
            ROUTE=comic-read-22 COMIC_FIXTURE=1 COMIC_ACTION=reading \
            THEME=terracotta-dark \
            docs/ci/screenshot.sh

      - name: open the comic reading panel in long strip (dark) and report
        if: matrix.group == 'comics'
