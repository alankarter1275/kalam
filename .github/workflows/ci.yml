          retention-days: 1

  publish-screenshots:
    name: publish screenshot report
    needs: screenshots
    if: always() && needs.screenshots.result != 'cancelled'
    runs-on: ubuntu-26.04
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download screenshot outputs
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: screenshots-*
          path: .
          merge-multiple: true

      # The Arena sandbox cannot download Actions artifacts -- the blob host is
      # unreachable from it, exactly like the Actions log host (which is why
      # clippy failures are committed to ci-logs/). The PNGs are for humans;
      # this text report is the only way the agent can see what happened.
      # Committed on success AND failure, because a failed run is precisely
      # when the diagnostics matter.
      - name: publish the report
        if: always()
        run: |
          mkdir -p ci-logs
          cp ci-shots-reader/report.txt ci-logs/reader-latest.txt 2>/dev/null \
            || echo "(no reader report produced)" > ci-logs/reader-latest.txt
          echo "--- run $GITHUB_RUN_ID ---" >> ci-logs/reader-latest.txt
          cp ci-shots-reader-chrome-light/report.txt ci-logs/reader-chrome-light-latest.txt 2>/dev/null \
            || echo "(no reader-chrome-light report produced)" > ci-logs/reader-chrome-light-latest.txt
          echo "--- run $GITHUB_RUN_ID ---" >> ci-logs/reader-chrome-light-latest.txt
          cp ci-shots-reader-chrome-dark/report.txt ci-logs/reader-chrome-dark-latest.txt 2>/dev/null \
            || echo "(no reader-chrome-dark report produced)" > ci-logs/reader-chrome-dark-latest.txt
          echo "--- run $GITHUB_RUN_ID ---" >> ci-logs/reader-chrome-dark-latest.txt
          cp ci-shots-reader-contents/report.txt ci-logs/reader-contents-latest.txt 2>/dev/null \
            || echo "(no reader-contents report produced)" > ci-logs/reader-contents-latest.txt
          echo "--- run $GITHUB_RUN_ID ---" >> ci-logs/reader-contents-latest.txt
          cp ci-shots-reader-notes/report.txt ci-logs/reader-notes-latest.txt 2>/dev/null \
            || echo "(no reader-notes report produced)" > ci-logs/reader-notes-latest.txt
          echo "--- run $GITHUB_RUN_ID ---" >> ci-logs/reader-notes-latest.txt
          cp ci-shots-reader-settings/report.txt ci-logs/reader-settings-latest.txt 2>/dev/null \
            || echo "(no reader-settings report produced)" > ci-logs/reader-settings-latest.txt
          echo "--- run $GITHUB_RUN_ID ---" >> ci-logs/reader-settings-latest.txt
          cp ci-shots-reader-chip/report.txt ci-logs/reader-chip-latest.txt 2>/dev/null \
            || echo "(no reader-chip report produced)" > ci-logs/reader-chip-latest.txt
          echo "--- run $GITHUB_RUN_ID ---" >> ci-logs/reader-chip-latest.txt
          cp ci-shots-reader-annotation/report.txt ci-logs/reader-annotation-latest.txt 2>/dev/null \
            || echo "(no reader-annotation report produced)" > ci-logs/reader-annotation-latest.txt
          echo "--- run $GITHUB_RUN_ID ---" >> ci-logs/reader-annotation-latest.txt
          cp ci-shots-reader-dict/report.txt ci-logs/reader-dict-latest.txt 2>/dev/null \
            || echo "(no reader-dict report produced)" > ci-logs/reader-dict-latest.txt
          echo "--- run $GITHUB_RUN_ID ---" >> ci-logs/reader-dict-latest.txt
          cp ci-shots-reader-dict-missing/report.txt ci-logs/reader-dict-missing-latest.txt 2>/dev/null \
            || echo "(no reader-dict-missing report produced)" > ci-logs/reader-dict-missing-latest.txt
          echo "--- run $GITHUB_RUN_ID ---" >> ci-logs/reader-dict-missing-latest.txt
          cp ci-shots-reader-search/report.txt ci-logs/reader-search-latest.txt 2>/dev/null \
            || echo "(no reader-search report produced)" > ci-logs/reader-search-latest.txt
          echo "--- run $GITHUB_RUN_ID ---" >> ci-logs/reader-search-latest.txt
          cp ci-shots-reader-search-missing/report.txt ci-logs/reader-search-missing-latest.txt 2>/dev/null \
            || echo "(no reader-search-missing report produced)" > ci-logs/reader-search-missing-latest.txt
          echo "--- run $GITHUB_RUN_ID ---" >> ci-logs/reader-search-missing-latest.txt
          cp ci-shots-tasks/report.txt ci-logs/tasks-latest.txt 2>/dev/null \
            || echo "(no tasks report produced)" > ci-logs/tasks-latest.txt
          echo "--- run $GITHUB_RUN_ID ---" >> ci-logs/tasks-latest.txt
          cp ci-shots-components-light/report.txt ci-logs/components-light-latest.txt 2>/dev/null \
            || echo "(no components-light report produced)" > ci-logs/components-light-latest.txt
          echo "--- run $GITHUB_RUN_ID ---" >> ci-logs/components-light-latest.txt
          cp ci-shots-components-dark/report.txt ci-logs/components-dark-latest.txt 2>/dev/null \
            || echo "(no components-dark report produced)" > ci-logs/components-dark-latest.txt
          echo "--- run $GITHUB_RUN_ID ---" >> ci-logs/components-dark-latest.txt
          cp ci-shots-book-light/report.txt ci-logs/book-light-latest.txt 2>/dev/null \
            || echo "(no book-light report produced)" > ci-logs/book-light-latest.txt
          echo "--- run $GITHUB_RUN_ID ---" >> ci-logs/book-light-latest.txt
          cp ci-shots-book-dark/report.txt ci-logs/book-dark-latest.txt 2>/dev/null \
            || echo "(no book-dark report produced)" > ci-logs/book-dark-latest.txt
          echo "--- run $GITHUB_RUN_ID ---" >> ci-logs/book-dark-latest.txt
          cp ci-shots-book-tags-light/report.txt ci-logs/book-tags-light-latest.txt 2>/dev/null \
            || echo "(no book-tags-light report produced)" > ci-logs/book-tags-light-latest.txt
          echo "--- run $GITHUB_RUN_ID ---" >> ci-logs/book-tags-light-latest.txt
          cp ci-shots-book-tags-dark/report.txt ci-logs/book-tags-dark-latest.txt 2>/dev/null \
            || echo "(no book-tags-dark report produced)" > ci-logs/book-tags-dark-latest.txt
          echo "--- run $GITHUB_RUN_ID ---" >> ci-logs/book-tags-dark-latest.txt
          cp ci-shots-book-annotations-light/report.txt ci-logs/book-annotations-light-latest.txt 2>/dev/null \
            || echo "(no book-annotations-light report produced)" > ci-logs/book-annotations-light-latest.txt
          echo "--- run $GITHUB_RUN_ID ---" >> ci-logs/book-annotations-light-latest.txt
          cp ci-shots-book-annotations-dark/report.txt ci-logs/book-annotations-dark-latest.txt 2>/dev/null \
            || echo "(no book-annotations-dark report produced)" > ci-logs/book-annotations-dark-latest.txt
          echo "--- run $GITHUB_RUN_ID ---" >> ci-logs/book-annotations-dark-latest.txt
          cp ci-shots-series-light/report.txt ci-logs/series-light-latest.txt 2>/dev/null \
            || echo "(no series-light report produced)" > ci-logs/series-light-latest.txt
          echo "--- run $GITHUB_RUN_ID ---" >> ci-logs/series-light-latest.txt
          cp ci-shots-series-dark/report.txt ci-logs/series-dark-latest.txt 2>/dev/null \
            || echo "(no series-dark report produced)" > ci-logs/series-dark-latest.txt
          echo "--- run $GITHUB_RUN_ID ---" >> ci-logs/series-dark-latest.txt
          cp ci-shots-series-list-light/report.txt ci-logs/series-list-light-latest.txt 2>/dev/null \
            || echo "(no series-list-light report produced)" > ci-logs/series-list-light-latest.txt
          echo "--- run $GITHUB_RUN_ID ---" >> ci-logs/series-list-light-latest.txt
          cp ci-shots-author-light/report.txt ci-logs/author-light-latest.txt 2>/dev/null \
            || echo "(no author-light report produced)" > ci-logs/author-light-latest.txt
          echo "--- run $GITHUB_RUN_ID ---" >> ci-logs/author-light-latest.txt
          cp ci-shots-author-dark/report.txt ci-logs/author-dark-latest.txt 2>/dev/null \
            || echo "(no author-dark report produced)" > ci-logs/author-dark-latest.txt
          echo "--- run $GITHUB_RUN_ID ---" >> ci-logs/author-dark-latest.txt
          cp ci-shots-author-panel-light/report.txt ci-logs/author-panel-light-latest.txt 2>/dev/null \
            || echo "(no author-panel-light report produced)" > ci-logs/author-panel-light-latest.txt
          echo "--- run $GITHUB_RUN_ID ---" >> ci-logs/author-panel-light-latest.txt
          cp ci-shots-author-shelf-light/report.txt ci-logs/author-shelf-light-latest.txt 2>/dev/null \
            || echo "(no author-shelf-light report produced)" > ci-logs/author-shelf-light-latest.txt
          echo "--- run $GITHUB_RUN_ID ---" >> ci-logs/author-shelf-light-latest.txt
          cp ci-shots-author-annotations-dark/report.txt ci-logs/author-annotations-dark-latest.txt 2>/dev/null \
            || echo "(no author-annotations-dark report produced)" > ci-logs/author-annotations-dark-latest.txt
          echo "--- run $GITHUB_RUN_ID ---" >> ci-logs/author-annotations-dark-latest.txt
          cp ci-shots-authors-light/report.txt ci-logs/authors-light-latest.txt 2>/dev/null \
            || echo "(no authors-light report produced)" > ci-logs/authors-light-latest.txt
          echo "--- run $GITHUB_RUN_ID ---" >> ci-logs/authors-light-latest.txt
          cp ci-shots-authors-dark/report.txt ci-logs/authors-dark-latest.txt 2>/dev/null \
            || echo "(no authors-dark report produced)" > ci-logs/authors-dark-latest.txt
          echo "--- run $GITHUB_RUN_ID ---" >> ci-logs/authors-dark-latest.txt
          cp ci-shots-author-edit-dark/report.txt ci-logs/author-edit-dark-latest.txt 2>/dev/null \
            || echo "(no author-edit-dark report produced)" > ci-logs/author-edit-dark-latest.txt
          echo "--- run $GITHUB_RUN_ID ---" >> ci-logs/author-edit-dark-latest.txt
          cp ci-shots-author-merge-dark/report.txt ci-logs/author-merge-dark-latest.txt 2>/dev/null \
            || echo "(no author-merge-dark report produced)" > ci-logs/author-merge-dark-latest.txt
          echo "--- run $GITHUB_RUN_ID ---" >> ci-logs/author-merge-dark-latest.txt
          # Settings has enough panes and states that spelling out 23
          # report/PNG pairs would bury the publish step. The slug is
          # the OUT suffix and the published PNG name, so this loop is
          # the whole mapping.
          for shot in settings-appearance-light settings-appearance-dark \
                      settings-reading-light settings-reading-dropdown-dark \
                      settings-libraries-light settings-libraries-open-dark \
                      settings-data-export-dark settings-book-files-light \
                      settings-book-files-delete-dark settings-watch-light \
                      settings-watch-dropdown-dark settings-watch-empty-light \
                      settings-dictionaries-drag-light \
                      settings-dictionaries-remove-dark \
                      settings-dictionaries-empty-light \
                      settings-metadata-rejected-light \
                      settings-integrations-dark settings-shortcuts-light \
                      settings-shortcuts-recording-dark settings-about-light \
                      settings-notifications-events-dark \
                      settings-notifications-empty-light \
                      settings-notifications-dot-dark; do
            cp "ci-shots-$shot/report.txt" "ci-logs/$shot-latest.txt" 2>/dev/null \
              || echo "(no $shot report produced)" > "ci-logs/$shot-latest.txt"
            echo "--- run $GITHUB_RUN_ID ---" >> "ci-logs/$shot-latest.txt"
            cp "ci-shots-$shot/03-settings-settled.png" \
              "ci-logs/$shot.png" 2>/dev/null || true
          done
          # The comics reader frames, by the same slug rule: the OUT
          # suffix is the published basename, and every frame settled
          # on the comic route.
          for shot in comics-chrome-light comics-chrome-dark \
                      comics-chapters-dark comics-pages-dark \
                      comics-reading-dark comics-reading-strip-dark \
                      comics-image-light comics-image-adjusted-dark \
                      comics-shortcuts-dark comics-jump-range-dark \
                      comics-presets-dark; do
            cp "ci-shots-$shot/report.txt" "ci-logs/$shot-latest.txt" 2>/dev/null \
              || echo "(no $shot report produced)" > "ci-logs/$shot-latest.txt"
            echo "--- run $GITHUB_RUN_ID ---" >> "ci-logs/$shot-latest.txt"
            cp "ci-shots-$shot/03-comic-read-22-settled.png" \
              "ci-logs/$shot.png" 2>/dev/null || true
          done
          # The comic-series drawer/dialog frames settle on the
          # chapter-anchored series route rather than the reader.
          for shot in comic-series-dark comic-series-edit-dark \
                      comic-series-find-dark \
                      comic-series-find-review-dark; do
            cp "ci-shots-$shot/report.txt" "ci-logs/$shot-latest.txt" 2>/dev/null \
              || echo "(no $shot report produced)" > "ci-logs/$shot-latest.txt"
            echo "--- run $GITHUB_RUN_ID ---" >> "ci-logs/$shot-latest.txt"
            cp "ci-shots-$shot/03-comic-series-book-22-settled.png" \
              "ci-logs/$shot.png" 2>/dev/null || true
          done
          # The PDF reader frames, by the same slug rule: the OUT
          # suffix is the published basename, and every frame settled
          # on the PDF route.
          for shot in pdf-chrome-light pdf-chrome-dark \
                      pdf-contents-dark pdf-contents-pinned-dark \
                      pdf-pages-dark pdf-pages-pinned-light \
                      pdf-pages-edit-dark pdf-pages-edit-drag-dark \
                      pdf-pages-edit-delete-dark pdf-pages-edit-unsaved-dark \
                      pdf-search-results-dark pdf-search-results-light \
                      pdf-search-no-matches-dark \
                      pdf-notes-dark pdf-notes-light \
                      pdf-notes-words-dark pdf-notes-bookmarks-dark \
                      pdf-notes-empty-dark \
                      pdf-reading-dark pdf-rotated-dark \
                      pdf-image-dark pdf-image-invert-dark \
