      - name: Upload screenshot outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.group }}
          path: |
            ci-shots-*/report.txt
            ci-shots-*/03-*-settled.png
          if-no-files-found: warn
          retention-days: 1

  publish-screenshots:
    # Main only. These reports and settled PNGs are large, and a
    # branch-specific copy would add roughly 20 MB per branch merged.
    # On a branch the screenshots job still runs and still uploads its
    # artifacts, so the owner can view them in the Actions page; they
    # are simply not committed until the work reaches main.
    name: publish screenshot report
    needs: screenshots
    # One condition, not two: this job already carried an `if:`, and adding a
    # second produced a duplicate YAML mapping key. The file still looked
    # plausible and the run failed with zero jobs, which is the only way a
    # parse error shows up from here.
    #
    # Main only, on top of the condition it already had. These reports and
    # settled PNGs are large, and a branch-specific copy would add roughly
    # 20 MB per branch merged. On a branch the screenshots job still runs and
    # still uploads its artifacts, so the owner can view them in the Actions
    # page; they are simply not committed until the work reaches main. A
    # pull_request event is never on refs/heads/main, so this also removes the
    # duplicate run without needing the same-repo clause the other jobs carry.
    if: always() && needs.screenshots.result != 'cancelled' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download screenshot outputs
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: screenshots-*
          path: .
          merge-multiple: true

      # The Arena sandbox cannot download Actions artifacts -- the blob host is
      # unreachable from it, exactly like the Actions log host (which is why
      # clippy failures are committed to ci-logs/). The PNGs are for humans;
      # this text report is the only way the agent can see what happened.
      # Committed on success AND failure, because a failed run is precisely
      # when the diagnostics matter.
      - name: publish the report
        if: always()
        run: |
          mkdir -p ci-logs
          if [ -f ci-shots-reader/report.txt ]; then cp ci-shots-reader/report.txt ci-logs/reader-latest.txt; else
            echo "  (no new reader-latest.txt this run; keeping the previously committed one)";
