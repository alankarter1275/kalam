# Compile-check Kalam on every push / PR.
# Headless: no display needed — we only cargo fmt/clippy/build.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# One run per branch at a time, but a newer push does NOT cancel the run it
# supersedes. It used to, and the reason was sound: two runs on one branch raced
# to commit ci-logs/ back to it, the second rebased onto a file the first had
# just rewritten, hit a conflict, and its `git push ... || true` silently dropped
# the report -- that is how the first reader screenshot report was lost.
#
# Cancelling solved that by destroying the evidence instead: a cancelled run
# never reaches its publish step, so the committed log belonged to an older
# commit, and a run that had already finished green was retroactively marked
# cancelled by the next push. Three debugging rounds in one session were spent
# asking the owner to paste compiler output that CI had already produced.
#
# The race is now closed at both ends rather than papered over. Each job skips
# the duplicate pull_request run for a same-repo branch, so one commit produces
# one run instead of two; and every publish step rebases with -X theirs, so a
# report always wins over the version already on the branch instead of being
# dropped. kalam-engine's own ci.yml uses the same group.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Deliberately false. Cancelling looks tidy and costs everything: a cancelled
  # run never reaches its publish step, so the report the agent needs is never
  # committed, and the log at the tip of the branch silently belongs to an older
  # commit. Worse, a run that had already finished green was retroactively
  # marked cancelled by the next push, which makes a good result look doubtful.
  # This project has one contributor, so queueing runs costs nothing and every
  # run leaves its evidence behind.
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Branch runs write their reports somewhere main never touches. Both used to
  # rewrite ci-logs/*-latest.txt, so a branch that had run CI and a main that had
  # run CI arrived at the merge holding different content for the same paths and
  # GitHub reported the pull request as CONFLICTING -- twice in one day, each time
  # needing the branch rebuilt on top of main by hand before it could merge. On
  # main this resolves to plain ci-logs/, so the canonical reports, and every
  # guardrail test that reads them, are unaffected.
  CILOG_DIR: ${{ github.ref_name == 'main' && 'ci-logs' || format('ci-logs/branches/{0}', github.ref_name) }}

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: build (ubuntu)
    # 26.04, not -latest: kalam-reader asks gtk4 for the v4_16 feature, Cargo
    # unifies that with Kalam's v4_12, and the gdk4-sys build script then
    # demands system GTK >= 4.16 through pkg-config. 24.04 (still -latest)
    # ships 4.14.5 and fails with "Package 'gtk4' has version '4.14.5',
    # required version is '>= 4.16'". Same reason kalam-engine's own CI is on
    # 26.04. The owner's machine is Arch, gtk4 4.20+.
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-4-dev libadwaita-1-dev libglib2.0-dev \
            libpango1.0-dev libgdk-pixbuf-2.0-dev \
            libgraphene-1.0-dev libgtksourceview-5-dev \
            libclang-dev libfontconfig1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # TEMPORARY -- DELETE THIS STEP ONCE IT HAS RUN.
      #
      # The application tree is not formatted under its own rustfmt.toml with
      # CI's toolchain (114 files under src/ and one under tests/), and the owner
      # chose to tidy it rather than leave the deviation recorded. The Arena
      # sandbox has no Rust toolchain and no network route to static.rust-lang.org,
      # so `cargo fmt` can only run here.
      #
      # Gated on a commit message rather than workflow_dispatch: a dispatchable
      # workflow has to exist on the default branch before it can be dispatched at
      # all, and this step never will. A message gate needs nothing from main.
      #
      # Placed before every check, and the tree is deliberately left formatted, so
      # the rustfmt report, clippy, the tests and the release build in this same
      # run all verify the reformatted source rather than the source that went in.
      #
      # The push is NOT `|| true`. A silently dropped reformat would leave the next
      # run looking at the old tree and reporting "not formatted" again, and the
      # only evidence that anything had happened would be a run that looked green.
      - name: one-shot reformat (temporary)
        if: "contains(github.event.head_commit.message, '[reformat]')"
        run: |
          cargo fmt -p kalam
          if git diff --quiet; then
            echo "nothing to reformat"
            exit 0
          fi
          echo "files reformatted: $(git diff --name-only | wc -l)"
          git diff --stat | tail -3
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -u
          # Every line of this step stays indented, including the commit message.
          # A `run: |` block is a YAML literal scalar: a line at column 0 ends the
          # block, and whatever follows it has to parse as YAML in its place. The
          # first version of this step wrote a conventionally wrapped commit body
          # at column 0, so the workflow did not parse at all and the run finished
          # with zero jobs -- no log, no step name, nothing to read. Hence one long
          # line per paragraph instead of a wrapped one.
          git commit -m "style: format the application tree with rustfmt [skip ci]" -m "cargo fmt -p kalam under CI's stable toolchain and the workspace rustfmt.toml (edition 2021, max_width 100, use_small_heuristics Default). Whitespace and line breaks only -- rustfmt does not change what the code does. crates/ is excluded on purpose: that is the vendored chapbook engine, and the rustfmt step below already records the decision to leave it unformatted."
          git pull --rebase -X theirs --autostash origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      # Cargo.lock is committed (see the ROADMAP entry for 2026-09-04). The
      # Arena sandbox has no network route to crates.io, so the agent cannot
      # generate or refresh it there; this step is how the lockfile gets
      # created and how a legitimate dependency change gets recorded.
      #
      # `cargo generate-lockfile` only writes when the manifest and the lock
      # disagree, so on a normal run this is a no-op and commits nothing.
      - name: Cargo.lock (generate and push if missing or stale)
        run: |
          cargo generate-lockfile
          if git diff --quiet -- Cargo.lock && [ -z "$(git status --porcelain Cargo.lock)" ]; then
            echo "Cargo.lock: unchanged"
          else
            echo "Cargo.lock: updating and pushing"
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add -f Cargo.lock
            git commit -m "ci: update Cargo.lock [skip ci]"
            git pull --rebase -X theirs --autostash origin "$GITHUB_REF_NAME" || true
            git push origin "HEAD:$GITHUB_REF_NAME" || true
          fi

      # Ensure self-contained pure-Rust OCR models are bundled in assets/models/ocr/
      - name: Fetch OCR models
        run: |
          mkdir -p assets/models/ocr
          DET_URL="https://ocrs-models.s3-accelerate.amazonaws.com/text-detection.rten"
          REC_URL="https://ocrs-models.s3-accelerate.amazonaws.com/text-recognition.rten"
          DET_FILE="assets/models/ocr/text-detection.rten"
          REC_FILE="assets/models/ocr/text-recognition.rten"

          if [ ! -f "$DET_FILE" ] || [ $(wc -c < "$DET_FILE") -lt 1000000 ]; then
            echo "Downloading text-detection.rten..."
            curl -L -f -o "$DET_FILE" "$DET_URL"
          fi
          if [ ! -f "$REC_FILE" ] || [ $(wc -c < "$REC_FILE") -lt 1000000 ]; then
            echo "Downloading text-recognition.rten..."
            curl -L -f -o "$REC_FILE" "$REC_URL"
          fi

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -f "$DET_FILE" "$REC_FILE"
          if ! git diff --cached --quiet; then
            echo "Committing downloaded OCR models..."
            git commit -m "chore(ocr): bundle text-detection and text-recognition rten models [skip ci]"
            git pull --rebase -X theirs --autostash origin "$GITHUB_REF_NAME" || true
            git push origin "HEAD:$GITHUB_REF_NAME" || true
          fi

      # Auto-fixes formatting and pushes the fix back.
      #
      # The push must rebase first. Earlier steps in *other* jobs commit
      # ci-logs/ to the same branch, so a bare `git push` here fails whenever
      # one of those landed between checkout and now — and because this step
      # has no `continue-on-error`, that failed the whole run over formatting
      # that had already been applied. It looked like a code problem and was
      # not. Also publishes the diff, since the sandbox cannot read Actions
      # logs and "rustfmt failed" with no detail is unactionable.
      # Formats, and reports what it changed. Deliberately does NOT fail the
      # run, and deliberately does not push.
      #
      # It used to auto-commit the fix. That failed three runs in a row for
      # reasons that had nothing to do with the code: the push collided with
      # the `Cargo.lock` step above (which also pushes) and with the ci-logs
      # commits from other jobs, and a rejected push exited non-zero and killed
      # the build. Formatting is not worth failing a build over, and a step
      # whose failure mode is unrelated to what it checks sends every
      # investigation to the wrong place (pitfalls §23).
      #
      # So: report, never gate. The diff is published by the step below, which
      # the agent can read — it cannot download Actions logs, so a bare
      # "rustfmt failed" was unactionable.
      - name: rustfmt (report only)
        id: fmt
        run: |
          # Capture rustfmt's own output instead of letting it abort the step.
          # When the tree does not parse, `cargo fmt` fails and there is no diff
          # to show -- a step that dies here publishes nothing at all, which is
          # exactly when the text is needed. This has already cost a debugging
          # round, because "rustfmt failed" arrived with no detail attached.
          # -p kalam rather than --all: the engine crates under crates/ are not
          # formatted to this workspace's rustfmt.toml and are deliberately left
          # alone, so including them adds churn to a report that is about the app.
          #
          # That does not make this report small, and the first version of this
          # comment claimed it did. Measured properly on 31 October 2026, the
          # deviation is 125 files and about 1 MB of diff -- and 114 of those
          # files are in src/, the application itself, not the engine crates. The
          # crates/ files only looked like the whole story because `git diff`
          # sorts alphabetically and crates/ comes first; the claim was drawn from
          # the first 40 lines of a 23,571-line report.
          #
          # So the tree is not formatted under its own rustfmt.toml with this
          # toolchain, and has not been for some time. This step is report-only by
          # design and the committed diff is capped below, so the finding is
          # recorded without adding a megabyte to the repository on every run.
          # Whether to reformat, or to accept that rustfmt.toml no longer
          # describes this codebase, is the owner's call and not CI's.
          fmt_output="$(cargo fmt -p kalam 2>&1)" || true
          # Read the diff BEFORE restoring the source, and restore BEFORE writing
          # the report.
          #
          # The restore is `git checkout -- .`, which reverts every TRACKED file,
          # and this report becomes tracked the first time it is published. The
          # step used to write the report first and restore last, so from the
          # second run onward the restore put the first run's copy back over the
          # top of the new one. The publish step then found nothing to commit,
          # its `|| true` swallowed the empty commit, and the marker froze: the
          # committed report belonged to the run that created the file, not to
          # any run since. Three consecutive green runs published nothing here.
          # (Found 31 October 2026, while checking why the 400-line cap below had
          # never been observed working. It had never been reached.)
          if git diff --quiet; then
            fmt_diff=""
          else
            fmt_diff="$(git diff)"
          fi
          # Restore, so clippy and the build see the committed source rather
          # than a locally reformatted copy.
          git checkout -- .

          mkdir -p "$CILOG_DIR"
          # Start empty every run. Appending to the committed file would carry
          # the previous run's complaint forward, which reads as an outstanding
          # problem long after it was fixed.
          : > $CILOG_DIR/rustfmt-latest.diff
          if [ -n "$fmt_output" ]; then
            printf '%s\n' "$fmt_output" >> $CILOG_DIR/rustfmt-latest.diff
          fi
          if [ -z "$fmt_diff" ]; then
            echo "rustfmt: clean"
            if [ -z "$fmt_output" ]; then
              # Leave a note rather than deleting the file. Deleting it only
              # removed the working copy -- the stale diff stayed committed, so
              # a later clean run still showed the previous run's complaint and
              # read as an outstanding problem.
              echo "clean" >> $CILOG_DIR/rustfmt-latest.diff
            fi
          else
            echo "rustfmt: the application tree is not formatted; diff follows"
            # Capped. An uncapped diff is how a report becomes bigger than the
            # problem it describes, and a formatting report over a few hundred
            # lines is telling you something structural, not fixable line by line.
            printf '%s\n' "$fmt_diff" | head -400 >> $CILOG_DIR/rustfmt-latest.diff
            dropped=$(( $(printf '%s\n' "$fmt_diff" | wc -l) - 400 ))
            if [ "$dropped" -gt 0 ]; then
              echo "(truncated: $dropped further diff lines not committed)" \
                >> $CILOG_DIR/rustfmt-latest.diff
            fi
          fi
          echo "--- run $GITHUB_RUN_ID ---" >> $CILOG_DIR/rustfmt-latest.diff
          # Always publish, on clean runs too, so the committed file describes
          # the latest run rather than the last untidy one. (This used to be
          # written twice in the clean branch, as dirty=0 then dirty=1; the
          # first was dead because the last write to GITHUB_OUTPUT wins.)
          echo "dirty=1" >> "$GITHUB_OUTPUT"

      # Runs on clean runs too, so the published file always describes the
      # latest run rather than the last untidy one.
      - name: publish the rustfmt diff
        if: steps.fmt.outputs.dirty == '1'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            # Branch reports arrive with the merge and are stale the moment main
            # rewrites the canonical ones. Drop them rather than accumulate one
            # directory per branch forever.
            rm -rf ci-logs/branches
            git rm -r -q --cached --ignore-unmatch ci-logs/branches >/dev/null || true
          fi
          git add -f "$CILOG_DIR"/rustfmt-latest.diff
          git commit -m "ci: publish rustfmt diff [skip ci]" || true
          git pull --rebase -X theirs --autostash origin "$GITHUB_REF_NAME" || true
          git push origin "HEAD:$GITHUB_REF_NAME" || true
        continue-on-error: true

      # The Arena sandbox cannot download Actions logs (the log host is
      # unreachable from it), so on failure we commit the compiler output back
      # to the branch under ci-logs/ where the agent can read it.
      # `-D warnings` turns every warning into an error, including plain rustc
      # ones like dead_code. Without it a warning could never fail a run: an
      # unused `pub fn` in src/service.rs sat through several "green" runs and
      # was only caught when a human read their own build output. `--all-targets`
      # compiles the bin, so unused items in the binary crate are reported.
      #
      # Trade-off, accepted deliberately: the toolchain is `stable`, so a new
      # Rust release that adds a lint can turn this red without the code
      # changing. The failure publishes to ci-logs/clippy-latest.txt, which the
      # agent can read, so that is recoverable rather than mysterious.
      - name: clippy
        id: clippy
        run: |
          set -o pipefail
          {
            echo "--- system libraries (the agent cannot read Actions logs, and"
            echo "--- kalam-reader's gtk4 v4_16 feature needs system GTK >= 4.16) ---"
            for pc in gtk4 gdk4 libadwaita-1 glib-2.0; do
              printf '%s: %s\n' "$pc" "$(pkg-config --modversion "$pc" 2>&1 || echo 'not found')"
            done
          } | tee /tmp/clippy.txt
          # --workspace, not just --all-targets. This workspace has a root
          # package (`kalam`), so with no `default-members` key Cargo selects
          # ONLY that package by default -- --all-targets picks targets, not
          # packages. Without --workspace the crates under crates/ and tools/
          # were compiled as dependencies but never linted, and the members
          # nothing depends on were never even built. They could fail to
          # compile and this run stayed green. When this was fixed on
          # 2026-09-18, 10 of the 11 workspace members were being skipped.
          # Two of those 11 -- chapbook-viewer-gtk and kalam-reader-demo --
          # were deleted on 2026-10-30, so the workspace is now 9 members and
          # the flag is still required for exactly the same reason.
          cargo clippy --workspace --all-targets --message-format=short -- -D warnings 2>&1 \
            | tee -a /tmp/clippy.txt
        continue-on-error: true

      # Runs on success too, for the same reason as the test log above.
      - name: publish clippy log
        if: always() && steps.clippy.outcome != 'skipped'
        run: |
          mkdir -p "$CILOG_DIR"
          # Prefer the diagnostic lines, but always fall back to the tail: a
          # grep that matches nothing used to publish an empty file, which is
          # worse than useless.
          grep -E "error|warning:" /tmp/clippy.txt | head -100 > $CILOG_DIR/clippy-latest.txt || true
          if [ ! -s $CILOG_DIR/clippy-latest.txt ]; then
            echo "(no lines matched; last 100 lines of output)" > $CILOG_DIR/clippy-latest.txt
          fi
          # The grep keeps the compiler's own lines; a failed build script is
          # reported by cargo as one "error:" line and the real cause is on the
          # lines after it, which match neither pattern. Append the tail always.
          echo "" >> $CILOG_DIR/clippy-latest.txt
          echo "=== last 80 lines of the raw log ===" >> $CILOG_DIR/clippy-latest.txt
          tail -80 /tmp/clippy.txt >> $CILOG_DIR/clippy-latest.txt || true
          echo "--- run $GITHUB_RUN_ID ---" >> $CILOG_DIR/clippy-latest.txt
          # Uncapped copy: the excerpt above is for humans, this is what the
          # agent reads when the first error is not in the tail.
          cp /tmp/clippy.txt $CILOG_DIR/clippy-full.txt || true
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -f "$CILOG_DIR"/clippy-latest.txt $CILOG_DIR/clippy-full.txt
          # These steps run under `if: always()`, so they publish on a clean
          # run too. Saying "failures" unconditionally put a lie into the
          # commit stream that an agent reads to find out what broke, and one
          # was chased as a real regression on 2026-10-30.
          if [ "${{ steps.clippy.outcome }}" = "success" ]; then
            MSG="ci: publish clippy log (clean) [skip ci]"
          else
            MSG="ci: publish clippy failures [skip ci]"
          fi
          git commit -m "$MSG" || true
          git pull --rebase -X theirs --autostash origin "$GITHUB_REF_NAME" || true
          git push origin "HEAD:$GITHUB_REF_NAME" || true

      - name: fail if clippy failed
        if: steps.clippy.outcome == 'failure'
        run: exit 1

      # cargo test: compiles and RUNS the unit tests (in-memory SQLite —
      # headless, no display needed). Failures publish the diagnostics to
      # ci-logs/test-latest.txt, same pattern as clippy above.
      - name: test
        id: test
        run: |
          set -o pipefail
          # --workspace: see the clippy step above. Before this, the run
          # executed one test binary -- `unittests src/main.rs` -- and stopped.
          # The ~420 tests under crates/*/tests and tools/*/tests (pagination,
          # reader conformance, locators, render goldens, the stability policy)
          # never ran at all.
          cargo test --workspace --all-targets --message-format=short 2>&1 \
            | tee /tmp/test.txt
        continue-on-error: true

      # Runs on success too. Publishing only on failure leaves the previous
      # failure committed, so a later green run still shows red -- it misread
      # as an outstanding problem three separate times before this was fixed.
      - name: publish test log
        if: always() && steps.test.outcome != 'skipped'
        run: |
          mkdir -p "$CILOG_DIR"
          grep -E "error|FAILED|panicked|test result" /tmp/test.txt \
            | head -100 > $CILOG_DIR/test-latest.txt || true
          if [ ! -s $CILOG_DIR/test-latest.txt ]; then
            echo "(no lines matched; last 100 lines of output)" > $CILOG_DIR/test-latest.txt
            tail -100 /tmp/test.txt >> $CILOG_DIR/test-latest.txt || true
          fi
          echo "--- run $GITHUB_RUN_ID ---" >> $CILOG_DIR/test-latest.txt
          cp /tmp/test.txt $CILOG_DIR/test-full.txt || true
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -f "$CILOG_DIR"/test-latest.txt $CILOG_DIR/test-full.txt
          # As above: outcome-aware, because this step publishes on green runs.
          if [ "${{ steps.test.outcome }}" = "success" ]; then
            MSG="ci: publish test log (all passing) [skip ci]"
          else
            MSG="ci: publish test failures [skip ci]"
          fi
          git commit -m "$MSG" || true
          git pull --rebase -X theirs --autostash origin "$GITHUB_REF_NAME" || true
          git push origin "HEAD:$GITHUB_REF_NAME" || true

      - name: fail if tests failed
        if: steps.test.outcome == 'failure'
        run: exit 1

      - name: build (release)
        run: cargo build --release

      # Diagnostic: replay the reader's OCR pipeline on the scanned-fixture
      # pages (release profile reuses the deps just built above) and publish
      # the full report - line geometry plus which lines the real selection
      # logic can and cannot reach - to ci-logs for offline analysis.
      - name: OCR scan probe (diagnostic)
        run: |
          set -o pipefail
          status=0
          cargo test --release --bin kalam ocr_scan_probe -- --ignored --nocapture 2>&1 | tee /tmp/ocr-probe.txt || status=$?
          mkdir -p "$CILOG_DIR"
          cp /tmp/ocr-probe.txt $CILOG_DIR/ocr-probe-latest.txt
          echo "--- run $GITHUB_RUN_ID ---" >> $CILOG_DIR/ocr-probe-latest.txt
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -f "$CILOG_DIR"/ocr-probe-latest.txt
          git commit -m "ci: publish OCR probe report [skip ci]" || true
          git pull --rebase -X theirs --autostash origin "$GITHUB_REF_NAME" || true
          git push origin "HEAD:$GITHUB_REF_NAME" || true
          exit $status

      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: kalam-release-binary
          path: target/release/kalam
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Smoke test: does the app actually launch, and does a book open?
  #
  # Why this exists when the build job already passes: compiling proves nothing
  # about a GTK app. This job has caught two bugs the build job was green
  # through -- Home's covers never loaded, and only the first two rows of the
  # grid ever filled. Neither is detectable from a unit test.
  #
  # Slimmed on 2026-09-18. It used to take a full grid screenshot pass, upload
  # PNG artifacts, and run a second 2,000-book scale job after it. The PNGs
  # went to nobody (the agent cannot download artifacts, and the text report
  # carries the same information), and the scale job re-answered a question
  # that was settled on 2026-09-04 and is recorded in
  # ci-logs/scale-2000-comparison.txt: windowed grid 247 MB / 7.1 ms against
  # the old build-every-card grid's 352 MB / 139.7 ms. Those numbers are the
  # evidence; re-measuring them on every push was not. Bring the scale run
  # back deliberately if the grid ever changes.
  #
  # One run remains, on the `read-1` route: it opens a real book through the
  # engine widget, so a panic, a wiring mistake or a blank page is caught.
  #
  # A SEPARATE job, on purpose:
  #   * `continue-on-error` so a flaky compositor can never block a correct
  #     change. This is a diagnostic, not a gate. CI remains the gate for
  #     compile/clippy/test only.
  #   * it needs `build` to pass first, so we never smoke-test a broken tree.
  #
  # Caveats, unchanged: the software (Cairo) renderer is NOT the renderer on a
  # real desktop, and headless sway is one virtual output rather than a tiling
  # session. A pass here means "it did not crash and it drew something", not
  # "it looks right". Read docs/ci/README-screenshots.md.
  # ---------------------------------------------------------------------------
  screenshots:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: smoke test (headless sway) — ${{ matrix.group }}
    needs: build
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        group: [epub, comics, pdf, pages, settings-a, settings-b]
    # 26.04, not -latest: kalam-reader asks gtk4 for the v4_16 feature, Cargo
    # unifies that with Kalam's v4_12, and the gdk4-sys build script then
    # demands system GTK >= 4.16 through pkg-config. 24.04 (still -latest)
    # ships 4.14.5 and fails with "Package 'gtk4' has version '4.14.5',
    # required version is '>= 4.16'". Same reason kalam-engine's own CI is on
    # 26.04. The owner's machine is Arch, gtk4 4.20+.
    runs-on: ubuntu-26.04
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install system runtime dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev libglib2.0-dev \
            libpango1.0-dev libgdk-pixbuf-2.0-dev \
            libgraphene-1.0-dev libgtksourceview-5-dev \
            sway grim wtype \
            xwayland \
            fonts-dejavu-core \
            python3 \
            libfontconfig1-dev

      - name: Download release binary
        uses: actions/download-artifact@v4
        with:
          name: kalam-release-binary
          path: target/release

      - name: Make binary executable
        run: chmod +x target/release/kalam

      # 139 books: matches the library the user actually measured on, so the
      # seeded state is a familiar one rather than an arbitrary small number.
      #
      # The reader is the part this branch replaced, and the owner's machine
      # would otherwise be the first place the engine widget ever runs.
      # `read-<id>` opens it on a seeded book, so a panic, a wiring mistake or
      # a blank page is caught here, in a text report the agent can read. Book
      # 1 always exists -- the seeder inserts with AUTOINCREMENT from 1.
      # TAP is deliberately not set: driving a pointer tap with swaymsg
      # reported "no change" at three positions in a fullscreen window with
      # both a one-second hold and an 80 ms one, which is evidence about
      # sway's synthetic pointer under a headless compositor, not about the
      # reader. The probe is still in screenshot.sh (TAP=1) for whoever
      # revisits it; the tap behaviour itself is verified by hand on the
      # owner's machine.
      - name: open a book and report
        if: matrix.group == 'epub'
        run: |
          chmod +x docs/ci/screenshot.sh docs/ci/check-shot.py
          BOOKS=139 OUT=ci-shots-reader SETTLE=25 ROUTE=read-1 \
            docs/ci/screenshot.sh

      # EPUB T2 (decisions 14-20, 145): the pure page with its summoned
      # chrome stood up on request — Back+Bubble unit, bookmark ribbon,
      # location percentage — in both modes. The page ground is the app
      # palette's own bg now, so the two frames also prove the page
      # follows the app theme rather than a reading theme.
      - name: open a book with its chrome up (light) and report
        if: matrix.group == 'epub'
        run: |
          BOOKS=139 OUT=ci-shots-reader-chrome-light SETTLE=25 ROUTE=read-1 \
            READER_ACTION=chrome THEME=terracotta-light \
            docs/ci/screenshot.sh

      - name: open a book with its chrome up (dark) and report
        if: matrix.group == 'epub'
        run: |
          BOOKS=139 OUT=ci-shots-reader-chrome-dark SETTLE=25 ROUTE=read-1 \
            READER_ACTION=chrome THEME=terracotta-dark \
            docs/ci/screenshot.sh

      # EPUB T3 (decisions 20-24, 145, 147): the left panel as Contents
      # + Notes and the right as Settings alone. The seeded book has
      # nothing annotated, so the Notes frame proves the chips and the
      # empty state rather than items; the Settings frame proves the
      # This-book card, the preview and the inset sections.
      - name: open the contents panel (dark) and report
        if: matrix.group == 'epub'
        run: |
          BOOKS=139 OUT=ci-shots-reader-contents SETTLE=25 ROUTE=read-1 \
            READER_ACTION=contents THEME=terracotta-dark \
