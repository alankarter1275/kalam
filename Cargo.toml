[package]
name = "kalam"
version = "0.1.0"
edition = "2021"
description = "Kalam — a lightweight personal ebook manager and reader for Linux"
license = "GPL-3.0-or-later"
authors = ["Kalam Contributors"]
repository = "https://github.com/alankarter1275/calibre-alt"
default-run = "kalam"

[features]
default = ["bundled-dictionaries"]
bundled-dictionaries = []

[dependencies]
relm4 = { version = "0.11", features = ["libadwaita", "gnome_45"] }
libadwaita = { version = "0.9", features = ["v1_4"] }
gtk = { version = "0.11", package = "gtk4", features = ["v4_12"] }
gdk-pixbuf = "0.22"
# A0 step 3: persistent cover thumbnails. gdk-pixbuf can decode but cannot
# encode PNG in this toolchain, so we use `image` (pure Rust, no system deps)
# to generate the small thumbnails written to cache/thumbs/ at import time.
# Default features are off to keep the binary lean (drop the avif/tiff/exr
# stack and rayon); `std` is always on in `image`, so we only need the codecs
# covers actually use (png to encode the thumbnail, jpeg/gif/webp to read them).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
glib = "0.22"
gio = { version = "0.22", package = "gio" }
# The reading engine: opens the EPUB itself and draws the page. It replaces
# the in-app browser page, so the browser and JS-engine crates are gone.
kalam-reader = { git = "https://github.com/alankarter1275/kalam-engine", tag = "v0.1.0" }

# Library / persistence
# `trace` powers the A0 step 7 query-count assertions in `src/perf.rs`: it is
# the only way to count statements from outside the call, which is what makes
# those tests machine-independent. Compiled into all builds because feature
# unification would pull it in for tests anyway; the callback is null unless
# something registers one, so the cost when unused is nil.
rusqlite = { version = "0.32", features = ["bundled", "trace"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
# Text normalization: NFD for dictionary headword keys (diacritic-insensitive lookup)
unicode-normalization = "0.1"
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Metadata fetch (P5). rustls by default — no OpenSSL system dependency.
ureq = "2"
# Hands results from the fetch worker thread back to the GTK main context.
async-channel = "2"

# EPUB (zip + OPF XML)
zip = { version = "2", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
quick-xml = "0.37"
flate2 = "1"
scraper = "0.27.0"
toml = "1.1.5"
urlencoding = "2.1.3"
epub-builder = "0.8.3"
wasmtime = { version = "24.0.0", features = ["component-model"] }

[profile.release]
# `lto = true` is fat LTO, and `codegen-units = 1` takes the backend's ability
# to work in parallel away; together they make rustc's peak memory roughly the
# size of the whole crate graph. The engine's git dependency drags stylo in,
# and on a 4 GB machine that peak is past the limit: rustc is killed by the
# OOM killer with no diagnostic at all, which reads as a crash rather than a
# memory problem. Thin LTO keeps most of the cross-crate inlining for a
# fraction of the peak, and leaving codegen-units at its default lets rustc
# use the machine's cores. CI has memory to spare and never saw this; the
# owner's 4 GB box is the machine this profile has to fit.
lto = "thin"
strip = true
opt-level = 3
