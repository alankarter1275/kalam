[workspace]
resolver = "2"
members = [
    ".",
    "crates/chapbook-core",
    "crates/chapbook-epub",
    "crates/chapbook-layout",
    "crates/chapbook-paint",
    "crates/chapbook-render-tinyskia",
    "crates/chapbook-reader",
    "crates/chapbook-viewer-gtk",
    "crates/kalam-reader",
    "tools/chapbook-cli",
    "tools/kalam-reader-demo",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
authors = ["Jeffrey T. Peckham <abic@ophymx.com>"]
repository = "https://github.com/ophymx/chapbook"
readme = "README.md"

[workspace.dependencies]
# Internal crates
chapbook-core = { path = "crates/chapbook-core" }
chapbook-epub = { path = "crates/chapbook-epub" }
chapbook-layout = { path = "crates/chapbook-layout", default-features = false }
chapbook-paint = { path = "crates/chapbook-paint" }
chapbook-render-tinyskia = { path = "crates/chapbook-render-tinyskia" }
chapbook-reader = { path = "crates/chapbook-reader", default-features = false }

mezzotint = { version = "0.1", default-features = false, features = ["std"] }

style = { version = "=0.20.0", package = "stylo" }
style_traits = { version = "=0.20.0", package = "stylo_traits" }
style_atoms = { version = "=0.20.0", package = "stylo_atoms" }
style_config = { version = "=0.20.0", package = "stylo_static_prefs" }
style_dom = { version = "=0.20.0", package = "stylo_dom" }
selectors = "=0.40.0"
cssparser = "=0.37.0"
euclid = "0.22"
app_units = "0.7"
html5ever = "0.39"
markup5ever = "0.39"
xml5ever = "0.39"

cosmic-text = { version = "0.19", default-features = false, features = [
    "std",
    "swash",
] }
unicode-script = "0.5"
unicode-segmentation = "1.12"
sys-locale = "0.3"
hyphenation = { version = "0.8", features = ["embed_en-us"] }
tiny-skia = "0.12"
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
] }
resvg = { version = "0.48", default-features = false, features = [
    "text",
    "raster-images",
] }
fontdb = { version = "0.24", default-features = false, features = [
    "std",
    "fs",
] }
formulary = { version = "0.2", default-features = false, features = [
    "shaping",
] }

rbook = { version = "0.7", default-features = false, features = [
    "threadsafe",
    "prelude",
] }
sha1 = "0.10"

quick-xml = "0.42"
url = "2"

futures-channel = { version = "0.3", default-features = false, features = [
    "std",
] }
futures-util = { version = "0.3", default-features = false, features = [
    "std",
] }
slotmap = "1"
thiserror = "2"
log = "0.4"
clap = { version = "4", features = ["derive"] }

insta = { version = "1", features = ["glob"] }
proptest = "1"

[package]
name = "kalam"
version = "0.1.0"
edition = "2021"
description = "Kalam — a lightweight personal ebook manager and reader for Linux"
license = "GPL-3.0-or-later"
authors = ["Kalam Contributors"]
repository = "https://github.com/alankarter1275/calibre-alt"
default-run = "kalam"

[features]
default = ["bundled-dictionaries"]
bundled-dictionaries = []

[dependencies]
relm4 = { version = "0.11", features = ["libadwaita", "gnome_45"] }
libadwaita = { version = "0.9", features = ["v1_4"] }
gtk = { version = "0.11", package = "gtk4", features = ["v4_12"] }
gdk-pixbuf = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
glib = "0.22"
gio = { version = "0.22", package = "gio" }
kalam-reader = { path = "crates/kalam-reader" }

# Library / persistence
rusqlite = { version = "0.32", features = ["bundled", "trace"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
unicode-normalization = "0.1"
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Metadata fetch (P5). rustls by default — no OpenSSL system dependency.
ureq = "2"
async-channel = "2"

# EPUB (zip + OPF XML)
zip = { version = "2", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
quick-xml = "0.37"
flate2 = "1"
scraper = "0.27.0"
toml = "1.1.5"
urlencoding = "2.1.3"
epub-builder = "0.8.3"

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
lto = "thin"
strip = true
opt-level = 3
