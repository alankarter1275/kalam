<!DOCTYPE html>
<html lang="en" data-theme="terracotta" data-mode="dark">
<head>
  <meta charset="UTF-8">
  <title>Kalam — Splash Screen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    
    /* THEME VARIABLES */
    :root { --transition-colors: background-color 0.6s ease, color 0.6s ease, border-color 0.6s ease; }

    /* Terracotta (Parchment) */
    :root[data-theme="terracotta"][data-mode="light"] { --bg: #F7F3EC; --text: #1C1917; --text-2: #78716C; --text-3: #A8A29E; --accent: #C1440E; --border: rgba(28,25,23,0.06); }
    :root[data-theme="terracotta"][data-mode="dark"] { --bg: #1A1512; --text: #E8DDD5; --text-2: #B3A8A0; --text-3: #807670; --accent: #D4552A; --border: rgba(232,221,213,0.05); }

    /* Forest Green */
    :root[data-theme="forest"][data-mode="light"] { --bg: #F3F6F3; --text: #191E1A; --text-2: #6B7A6E; --text-3: #9CA89E; --accent: #3A7D44; --border: rgba(25,30,26,0.06); }
    :root[data-theme="forest"][data-mode="dark"] { --bg: #121A13; --text: #DCE8DC; --text-2: #9CB0A0; --text-3: #6B7A6E; --accent: #5A9E64; --border: rgba(220,232,220,0.05); }

    /* Ink Blue */
    :root[data-theme="ink"][data-mode="light"] { --bg: #F2F4F7; --text: #181A1F; --text-2: #6B7280; --text-3: #9CA3AF; --accent: #2563EB; --border: rgba(24,26,31,0.06); }
    :root[data-theme="ink"][data-mode="dark"] { --bg: #0B111A; --text: #D4DCE8; --text-2: #94A3B8; --text-3: #64748B; --accent: #60A5FA; --border: rgba(212,220,232,0.05); }

    /* Amber */
    :root[data-theme="amber"][data-mode="light"] { --bg: #F9F6F0; --text: #1E1A16; --text-2: #7A6F62; --text-3: #A69B8E; --accent: #D97706; --border: rgba(30,26,22,0.06); }
    :root[data-theme="amber"][data-mode="dark"] { --bg: #1A1608; --text: #E8E0D0; --text-2: #B5A890; --text-3: #827660; --accent: #F59E0B; --border: rgba(232,224,208,0.05); }

    html, body { 
      height: 100%; 
      background: var(--bg); 
      color: var(--text); 
      font-family: 'DM Sans', sans-serif; 
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
      transition: var(--transition-colors);
    }

    .splash-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }

    /* ── 1. FLOATING BACKGROUND ── */
    .floating-bg {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }
    
    .floating-page {
      position: absolute;
      bottom: -150px;
      aspect-ratio: 2/3;
      background: rgba(128, 128, 128, 0.04);
      border-radius: 4px;
      animation: floatUp linear infinite;
      opacity: 0;
      transform: translateZ(0);
      will-change: transform, opacity;
    }

    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 30%, var(--bg) 100%);
      z-index: 1;
      pointer-events: none;
    }

    /* ── 2. CENTERPIECE ── */
    .centerpiece {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: fadeIn 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }

    .logo-wrapper {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: var(--bg);
      /* Removed the breathing animation so the logo remains perfectly static and crisp */
      transform: translateZ(0);
    }

    .loading-track {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px solid var(--border);
    }

    .loading-spin {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px solid transparent;
      border-top-color: var(--accent);
      animation: spin 1s linear infinite;
    }

    .brand-name {
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--text-2);
      margin-top: 24px;
      padding-left: 0.35em;
    }

    /* ── 3. LITERARY QUOTE ── */
    .quote-block {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      max-width: 540px;
      width: 90%;
      z-index: 2;
      animation: fadeInUp 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) 0.6s both;
    }
    
    .quote-text {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 18px;
      line-height: 1.6;
      color: var(--text);
      margin-bottom: 12px;
    }
    
    .quote-author {
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-3);
      letter-spacing: 0.05em;
    }

    /* ── ANIMATIONS ── */
    @keyframes spin {
      0% { transform: rotate(0deg) translateZ(0); }
      100% { transform: rotate(360deg) translateZ(0); }
    }

    @keyframes floatUp {
      0% { transform: translateY(150px) rotate(0deg) translateZ(0); opacity: 0; }
      15% { opacity: 0.8; }
      85% { opacity: 0.8; }
      100% { transform: translateY(-110vh) rotate(360deg) translateZ(0); opacity: 0; }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translate(-50%, 15px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }

    /* Theme Switcher Overlay */
    .theme-controls {
      position: absolute;
      top: 24px;
      right: 24px;
      z-index: 100;
      display: flex;
      gap: 12px;
      background: rgba(128,128,128,0.1);
      padding: 12px;
      border-radius: 8px;
      backdrop-filter: blur(8px);
      opacity: 0.3;
      transition: opacity 0.2s;
    }
    .theme-controls:hover { opacity: 1; }
    .theme-controls button {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      font-weight: 600;
    }
    .theme-controls button:hover {
      background: rgba(128,128,128,0.2);
    }
  

</style>
</head>
<body>
  <!-- Mockup controls -->
  <div class="theme-controls">
    <button onclick="document.documentElement.setAttribute('data-theme', 'terracotta')">Parchment</button>
    <button onclick="document.documentElement.setAttribute('data-theme', 'forest')">Forest</button>
    <button onclick="document.documentElement.setAttribute('data-theme', 'ink')">Ink</button>
    <button onclick="document.documentElement.setAttribute('data-theme', 'amber')">Amber</button>
    <button onclick="toggleMode()">Light/Dark</button>
  </div>

  <div class="splash-container">
    <div class="floating-bg" id="floating-bg"></div>
    <div class="vignette"></div>

    <div class="centerpiece">
      <div class="logo-wrapper">
        <div class="loading-track"></div>
        <div class="loading-spin"></div>
        <div class="logo"></div>
      </div>
      <div class="brand-name">Kalam</div>
    </div>

    <div class="quote-block">
      <div class="quote-text" id="quote-text">"A reader lives a thousand lives before he dies. The man who never reads lives only one."</div>
      <div class="quote-author" id="quote-author">— George R.R. Martin</div>
    </div>
  </div>

  <script>
    const bg = document.getElementById('floating-bg');
    const pageCount = 36;

    for (let i = 0; i < pageCount; i++) {
      const page = document.createElement('div');
      page.className = 'floating-page';
      
      const leftPos = Math.random() * 100;
      page.style.left = `${leftPos}%`;
      
      const sizeBase = Math.random() * 30 + 15;
      page.style.width = `${sizeBase}px`;
      
      const duration = (Math.random() * 20) + 15;
      page.style.animationDuration = `${duration}s`;
      
      const delay = (Math.random() * -30);
      page.style.animationDelay = `${delay}s`;

      const blur = (Math.random() * 2);
      page.style.filter = `blur(${blur}px)`;
      
      bg.appendChild(page);
    }

    const quotes = [
      { text: "\"A reader lives a thousand lives before he dies. The man who never reads lives only one.\"", author: "— George R.R. Martin" },
      { text: "\"We read to know we are not alone.\"", author: "— C.S. Lewis" },
      { text: "\"I have always imagined that Paradise will be a kind of library.\"", author: "— Jorge Luis Borges" },
      { text: "\"Fairy tales are more than true: not because they tell us that dragons exist, but because they tell us that dragons can be beaten.\"", author: "— Neil Gaiman" }
    ];
    
    const q = quotes[Math.floor(Math.random() * quotes.length)];
    document.getElementById('quote-text').innerText = q.text;
    document.getElementById('quote-author').innerText = q.author;

    function toggleMode() {
      const el = document.documentElement;
      el.setAttribute('data-mode', el.getAttribute('data-mode') === 'dark' ? 'light' : 'dark');
    }
  </script>
</body>
</html>
