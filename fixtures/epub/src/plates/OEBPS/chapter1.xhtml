<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">
<head>
  <title>Plates</title>
  <link rel="stylesheet" type="text/css" href="style.css"/>
</head>
<body>
  <div class="squeeze center">
    <div class="squeeze squeeze50"><img alt="PART ONE" class="plate" src="images/plate.png" style="width:100%"/></div>
  </div>
  <p>A part-title plate: the publisher's lettering as a picture, black
  ink on white, the kind that turns into a glaring slab on a dark page.</p>
  <div class="squeeze center">
    <div class="squeeze squeeze50"><img alt="a colour photograph" class="photo" src="images/photo.png" style="width:100%"/></div>
  </div>
  <p>A colour picture, which must never be inverted.</p>
</body>
</html>
